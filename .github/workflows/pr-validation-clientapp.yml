name: eShop Pull Request Validation - ClientApp (Avalonia)

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/ClientApp/**'
      - 'src/ClientApp.Desktop/**'
      - 'src/ClientApp.Android/**'
      - 'src/ClientApp.iOS/**'
      - 'src/ClientApp.Browser/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-clientapp.yml'
  push:
    branches:
      - main
    paths:
      - 'src/ClientApp/**'
      - 'src/ClientApp.Desktop/**'
      - 'src/ClientApp.Android/**'
      - 'src/ClientApp.iOS/**'
      - 'src/ClientApp.Browser/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-clientapp.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # setup-dotnet re-downloads the whole SDK (~300MB) via dotnet-install every run
      # when global.json's pinned version/rollForward doesn't exactly match whatever the
      # runner image ships, and dotnet workload install re-downloads every pack it needs
      # on top of that -- confirmed from this job's own real logs (DOTNET_ROOT resolves to
      # C:\Program Files\dotnet on windows-latest). Restoring that whole directory from
      # cache before setup-dotnet/workload install run makes both steps see a matching
      # install already present and skip the network fetch; they stay correct either way
      # since dotnet-install and workload install are both version-checked and idempotent.
      - name: Cache .NET SDK and workloads
        uses: actions/cache@v6
        with:
          path: C:\Program Files\dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('global.json', '.github/workflows/pr-validation-clientapp.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6

      - name: Update Workloads
        run: dotnet workload update

      # Pinned to workload set 10.0.401, dotnet/macios' last release explicitly documented as
      # "Xcode 26.6 support" (confirmed via its GitHub release notes) -- an unpinned install
      # grabs whatever's newest, which as of this writing defaults net10.0-ios to a pack that
      # requires the not-yet-GA Xcode 27 preview, breaking the build on every current runner
      # image (none of which ship Xcode 27, confirmed via actions/runner-images).
      - name: Install Workloads
        shell: pwsh
        run: |
          dotnet workload install android --version 10.0.401
          dotnet workload install ios --version 10.0.401

      # Build/Test steps intentionally still not enabled: ClientApp's business logic
      # (Services/ViewModels) and real Views are mid-rebuild on Avalonia (replacing MAUI,
      # 2026-10-14). Enable once that work lands -- the project family itself (ClientApp,
      # .Desktop, .Android, .iOS, .Browser) and the workload installs above are already real
      # and worth keeping green in the meantime.
      # - name: Build Desktop
      #   run: dotnet build src/ClientApp.Desktop/ClientApp.Desktop.csproj
      # - name: Build Android (compile-only)
      #   run: dotnet build src/ClientApp.Android/ClientApp.Android.csproj
      # - name: Build iOS (compile-only)
      #   run: dotnet build src/ClientApp.iOS/ClientApp.iOS.csproj
      # - name: Build Browser
      #   run: dotnet build src/ClientApp.Browser/ClientApp.Browser.csproj
      # - name: Test
      #   run: dotnet test --project tests/ClientApp.UnitTests/ClientApp.UnitTests.csproj --no-progress --output detailed

  ios-simulator:
    # Real iOS Simulator run, not just a compile check -- GitHub's macOS runners are actual
    # Macs with Xcode preinstalled, so this builds and genuinely launches the app rather than
    # only verifying it compiles. Simulator builds don't need a real Apple Developer
    # certificate/code-signing (unlike device/App Store builds), so no paid account is needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Same caching rationale as the windows job above -- confirmed from this job's own
      # real logs that DOTNET_ROOT resolves to /Users/runner/.dotnet on macos-latest (not
      # /usr/local/share/dotnet, which is only where the runner image's own preinstalled
      # copy lives; setup-dotnet installs its own under the runner's home directory here).
      - name: Cache .NET SDK and workloads
        uses: actions/cache@v6
        with:
          path: /Users/runner/.dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('global.json', '.github/workflows/pr-validation-clientapp.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6

      # Pinned to workload set 10.0.401 -- see the windows job's comment above for why.
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.401

      - name: Build for iOS Simulator
        run: dotnet build src/ClientApp.iOS/ClientApp.iOS.csproj -c Release -p:RuntimeIdentifier=iossimulator-arm64

      - name: Boot simulator, install, and launch
        run: |
          set -euo pipefail

          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $UDID"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find artifacts/bin/ClientApp.iOS -name "*.app" -path "*iossimulator-arm64*" | head -n 1)
          echo "Installing: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          xcrun simctl launch "$UDID" com.companyname.eshop

          sleep 3
          mkdir -p artifacts/ios-simulator
          xcrun simctl io "$UDID" screenshot artifacts/ios-simulator/launch.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-screenshot
          path: artifacts/ios-simulator/launch.png

  android-emulator:
    # Real Android Emulator run, mirroring the ios-simulator job above -- boots a genuine
    # emulator (hardware-accelerated via KVM, confirmed as the current recommended setup from
    # reactivecircus/android-emulator-runner's own README) and installs/launches the real APK
    # rather than only compiling it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Required for the emulator to run hardware-accelerated rather than falling back to pure
      # software emulation (which is slow enough to risk job timeouts) -- the exact udev rule
      # recommended by reactivecircus/android-emulator-runner's own README for ubuntu-latest.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same caching rationale as the windows/ios-simulator jobs above. DOTNET_ROOT here is
      # unverified against a real log (unlike the other two, confirmed from this run's own
      # output) -- /home/runner/.dotnet follows dotnet-install.sh's own documented default of
      # $HOME/.dotnet when no install dir is given, matching the pattern already confirmed on
      # macOS; will fix from this job's real log if that assumption turns out wrong.
      - name: Cache .NET SDK and workloads
        uses: actions/cache@v6
        with:
          path: /home/runner/.dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('global.json', '.github/workflows/pr-validation-clientapp.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6

      # Pinned to workload set 10.0.401 -- see the windows job's comment above for why.
      - name: Install Android workload
        run: dotnet workload install android --version 10.0.401

      # Confirmed locally: a plain `dotnet build -c Release` for net10.0-android does not run
      # linking/trimming the way net10.0-ios's build does -- that's a `dotnet publish` concern
      # here -- so none of the NoWarn/IL20xx handling the iOS project needed applies.
      - name: Build for Android Emulator
        run: dotnet build src/ClientApp.Android/ClientApp.Android.csproj -c Release -p:RuntimeIdentifier=android-x64

      # api-level/target/arch match the system image already verified working for the local
      # AVD set up on this machine (android-36, google_apis, x86_64) -- not a guess.
      - name: Boot emulator, install, and launch
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          # This action runs `script` via /usr/bin/sh, not bash -- confirmed from a real failed
          # run (`sh: 1: set: Illegal option -o pipefail`). pipefail is a bash/ksh extension
          # POSIX sh (dash, on Ubuntu) doesn't have; -e/-u alone are POSIX-standard and enough,
          # since the one pipe below (find | head) still fails loudly downstream at `adb
          # install ""` if it comes up empty.
          script: |
            set -eu

            APK_PATH=$(find artifacts/bin/ClientApp.Android -name "*-Signed.apk" -path "*release_android-x64*" | head -n 1)
            echo "Installing: $APK_PATH"
            adb install "$APK_PATH"

            # monkey resolves and starts the app's own launcher activity, so nothing here needs
            # to know the mangled Java class name .NET for Android generates for MainActivity.
            adb shell monkey -p com.companyname.eshop -c android.intent.category.LAUNCHER 1

            sleep 5
            mkdir -p artifacts/android-emulator
            adb exec-out screencap -p > artifacts/android-emulator/launch.png

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-screenshot
          path: artifacts/android-emulator/launch.png

  browser:
    # Real browser run, mirroring ios-simulator/android-emulator -- publishes the actual WASM
    # app, serves it, and loads it in a genuine headless Chromium rather than only compiling it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same caching rationale as the other jobs above. Same unverified-path caveat as the
      # android-emulator job's cache step -- not yet confirmed against a real log here either.
      - name: Cache .NET SDK and workloads
        uses: actions/cache@v6
        with:
          path: /home/runner/.dotnet
          key: ${{ runner.os }}-dotnet-${{ hashFiles('global.json', '.github/workflows/pr-validation-clientapp.yml') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6

      # wasm-tools is only needed for *publish* (the AOT/linking step that produces a real,
      # runnable wwwroot bundle) -- confirmed locally that `dotnet build` alone doesn't need it.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --version 10.0.401

      - name: Publish Browser
        run: dotnet publish src/ClientApp.Browser/ClientApp.Browser.csproj -c Release

      # Ubuntu 24.04's system Python enforces PEP 668 (externally-managed-environment), so a
      # bare `pip install` is refused outside a venv. --break-system-packages is the sanctioned
      # escape hatch for exactly this case -- a single-use CI VM has nothing to protect.
      - name: Install Playwright
        run: |
          pip install --break-system-packages playwright
          playwright install --with-deps chromium

      - name: Serve and screenshot
        run: |
          set -euo pipefail

          python3 -m http.server 8080 --directory artifacts/publish/ClientApp.Browser/release/wwwroot &
          SERVER_PID=$!
          sleep 2

          mkdir -p artifacts/browser
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1280, "height": 800})
              page.goto("http://localhost:8080", wait_until="networkidle")
              page.wait_for_timeout(5000)
              page.screenshot(path="artifacts/browser/launch.png")
              browser.close()
          PY

          kill $SERVER_PID

      - name: Upload browser screenshot
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshot
          path: artifacts/browser/launch.png
