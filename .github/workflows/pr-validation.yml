name: eShop Pull Request Validation

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'src/ClientApp.Desktop/**'
      - 'src/ClientApp.Android/**'
      - 'src/ClientApp.Browser/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-clientapp.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'src/ClientApp.Desktop/**'
      - 'src/ClientApp.Android/**'
      - 'src/ClientApp.Browser/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-clientapp.yml'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6
      - name: Build
        run: dotnet build eShop.Web.slnf
      - name: Test
        run: |
          set +e
          output=$(dotnet test --solution eShop.Web.slnf --no-build --no-progress --output detailed --coverage --coverage-output-format cobertura --report-trx --results-directory ./TestResults 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "No test projects were found"; then
            echo "No test projects exist yet (tests/ hasn't been added) - not a real failure."
            exit 0
          fi
          exit $exit_code
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-empty: false
      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        if: always()
        run: |
          reportgenerator             -reports:"TestResults/**/*.cobertura.xml"             -targetdir:"TestResults/coverage-report"             -reporttypes:"Html;Cobertura"             -title:"eshop-full coverage"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: |
            TestResults/coverage-report/**
            TestResults/**/*.cobertura.xml
          if-no-files-found: ignore

  identity-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn workspace identity-webapp lint
      - name: Test
        run: yarn workspace identity-webapp test:ci
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Identity.WebApp Test Results
          path: 'src/Identity.WebApp/test-results/junit.xml'
          reporter: jest-junit
          fail-on-empty: false
      - name: Build
        run: yarn workspace identity-webapp build

  webhookclient-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn workspace webhookclient-webapp lint
      - name: Test
        run: yarn workspace webhookclient-webapp test:ci
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: WebhookClient.WebApp Test Results
          path: 'src/WebhookClient.WebApp/test-results/junit.xml'
          reporter: jest-junit
          fail-on-empty: false
      - name: Build
        run: yarn workspace webhookclient-webapp build
