name: eShop Pull Request Validation

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v5
      - name: Build
        run: dotnet build eShop.Web.slnf
      - name: Test
        run: |
          set +e
          output=$(dotnet test --solution eShop.Web.slnf --no-build --no-progress --output detailed 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "No test projects were found"; then
            echo "No test projects exist yet (tests/ hasn't been added) - not a real failure."
            exit 0
          fi
          exit $exit_code
