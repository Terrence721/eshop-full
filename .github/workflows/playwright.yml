name: Playwright Tests for eShop
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Enable corepack
      run: corepack enable
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    - name: Generate .NET HTTPS Development Certificate
      # No --trust: Ubuntu runners have no unified OS trust store for
      # dotnet dev-certs to write to, and nothing here needs it trusted --
      # tests run over HTTP (see ESHOP_USE_HTTP_ENDPOINTS below). Still
      # generate the cert itself, since Kestrel may fail to bind its
      # HTTPS endpoint at startup if no cert file exists at all.
      run: |
        dotnet dev-certs https --clean
        dotnet dev-certs https
    # The steps below are commented out until src/eShop.AppHost exists.
    # playwright.config.ts's webServer runs
    # `dotnet run --project src/eShop.AppHost/eShop.AppHost.csproj` to give
    # the tests a live app to hit -- that project doesn't exist yet
    # (deliberately added last, see todo.md), so every run fails at
    # "Run Playwright tests" with "provided file path does not exist."
    # Once eShop.AppHost is added, uncomment these three steps.
    # - name: Install Playwright Browsers
    #   run: yarn playwright install chromium
    # - name: Run Playwright tests
    #   run: yarn playwright test
    #   env:
    #     ESHOP_USE_HTTP_ENDPOINTS: 1
    #     USERNAME1: bob
    #     PASSWORD: Pass123$
