name: eShop Pull Request Validation - .NET MAUI

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  push:
    branches:
      - main
    paths:
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6

      - name: Update Workloads
        run: dotnet workload update

      - name: Install Workloads
        shell: pwsh
        run: |
          dotnet workload install android
          dotnet workload install ios
          dotnet workload install maccatalyst
          dotnet workload install maui

      # Commented out until src/ClientApp exists (deliberately added last
      # among the client projects, see todo.md). Until then this fails
      # every run with MSB1009 ("Project file does not exist"), which is
      # genuine -- there's nothing to build yet -- but wastes the ~2
      # minutes the workload installs above take on every run that
      # touches this file. Workload installs stay live since a broken
      # workload feed is still a real regression worth catching.
      # Uncomment once ClientApp is added.
      # - name: Build
      #   run: dotnet build src/ClientApp/ClientApp.csproj
      #
      # - name: Test
      #   run: dotnet test --project tests/ClientApp.UnitTests/ClientApp.UnitTests.csproj --no-progress --output detailed
